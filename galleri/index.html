    <div class="Lysboks" aria-hidden="true">
        <button class="LysboksLukk" type="button" aria-label="Lukk">&times;</button>
        <img class="LysboksBilde" src="" alt="">
    </div>

    <script>
        const lysboks = document.querySelector(".Lysboks");
        const lysboksBilde = document.querySelector(".LysboksBilde");

        document.querySelectorAll(".galleriBilde").forEach((knapp) => {
            knapp.addEventListener("click", () => {
                const bilde = knapp.querySelector("img");
                lysboksBilde.src = bilde.src;
                lysboksBilde.alt = bilde.alt;
                lysboks.classList.add("aapen");
                lysboks.setAttribute("aria-hidden", "false");
            });
        });

        function lukkLysboks() {
            lysboks.classList.remove("aapen");
            lysboks.setAttribute("aria-hidden", "true");
        }

        lysboks.addEventListener("click", (e) => {
            if (e.target !== lysboksBilde) lukkLysboks();
        });
        document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") lukkLysboks();
        });
    </script>
